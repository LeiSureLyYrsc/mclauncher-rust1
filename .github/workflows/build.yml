name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis,msi
            rust_target: ""
            out_dir: src-tauri/target/release
            artifact_name: mclauncher-windows-x64
            portable_name: MCLauncher-portable-windows-x64.exe
          - platform: windows-latest
            # 32-bit（i686）；NSIS 安装包 + portable；MSI 对非默认 target 偶发不稳，x86 以 nsis+exe 为主
            args: --target i686-pc-windows-msvc --bundles nsis
            rust_target: i686-pc-windows-msvc
            out_dir: src-tauri/target/i686-pc-windows-msvc/release
            artifact_name: mclauncher-windows-x86
            portable_name: MCLauncher-portable-windows-x86.exe
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
            rust_target: ""
            out_dir: src-tauri/target/release
            artifact_name: mclauncher-linux-x64
            portable_name: MCLauncher-linux-x64
          - platform: macos-latest
            args: --bundles app,dmg
            rust_target: ""
            out_dir: src-tauri/target/release
            artifact_name: mclauncher-macos
            portable_name: ""
    runs-on: ${{ matrix.platform }}
    name: build (${{ matrix.artifact_name }})
    steps:
      - uses: actions/checkout@v4

      - name: Fetch UI assets (melody-launcher raw)
        shell: bash
        run: bash scripts/fetch-assets.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.artifact_name }}

      - name: Install frontend deps
        run: npm ci

      - name: Generate app icons
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python scripts/gen-icons.py
          npx tauri icon src-tauri/icons/app-icon.png

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          B="${{ matrix.out_dir }}"
          echo "Collecting from $B"
          ls -la "$B" || true
          ls -la "$B/bundle" 2>/dev/null || true
          case "${{ matrix.platform }}" in
            windows-*)
              if [[ ! -f "$B/mclauncher-rust1.exe" ]]; then
                echo "ERROR: missing portable exe at $B/mclauncher-rust1.exe"
                find src-tauri/target -name 'mclauncher-rust1.exe' 2>/dev/null | head -20
                exit 1
              fi
              cp "$B/mclauncher-rust1.exe" "out/${{ matrix.portable_name }}"
              # NSIS / MSI（若有）
              if compgen -G "$B/bundle/nsis/*.exe" > /dev/null; then
                for f in "$B"/bundle/nsis/*.exe; do
                  base=$(basename "$f")
                  # 区分架构：x86 产物加 -x86 后缀，避免与 x64 混淆
                  if [[ "${{ matrix.artifact_name }}" == *x86* ]]; then
                    cp "$f" "out/${base%.exe}-x86.exe"
                  else
                    cp "$f" "out/$base"
                  fi
                done
              fi
              if compgen -G "$B/bundle/msi/*.msi" > /dev/null; then
                for f in "$B"/bundle/msi/*.msi; do
                  base=$(basename "$f")
                  if [[ "${{ matrix.artifact_name }}" == *x86* ]]; then
                    cp "$f" "out/${base%.msi}-x86.msi"
                  else
                    cp "$f" "out/$base"
                  fi
                done
              fi
              ;;
            ubuntu-*)
              cp $B/bundle/appimage/*.AppImage out/ || true
              cp $B/bundle/deb/*.deb out/ || true
              cp "$B/mclauncher-rust1" "out/${{ matrix.portable_name }}" || true
              ;;
            macos-*)
              cp $B/bundle/dmg/*.dmg out/ || true
              (cd $B/bundle/macos && zip -qry "$GITHUB_WORKSPACE/out/MCLauncher-macos.app.zip" *.app) || true
              ;;
          esac
          echo "==== out/ ===="
          ls -la out
          # Windows 必须至少有 portable
          if [[ "${{ matrix.platform }}" == windows-* ]]; then
            test -f "out/${{ matrix.portable_name }}"
          fi

      - name: UPX pack Windows portable
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          PORTABLE="out/${{ matrix.portable_name }}"
          test -f "$PORTABLE"
          base="${PORTABLE%.exe}"
          # 未压缩备用（体积较大；SmartScreen/杀软更友好时可选用）
          cp "$PORTABLE" "${base}-uncompressed.exe"
          # 下载 UPX（宿主机为 x64，可压缩 PE32 / PE32+）
          UPX_VER=4.2.4
          curl -fsSL "https://github.com/upx/upx/releases/download/v${UPX_VER}/upx-${UPX_VER}-win64.zip" -o /tmp/upx.zip
          python -c "import zipfile; zipfile.ZipFile('/tmp/upx.zip').extractall('/tmp/upx-extract')"
          UPX_BIN=$(find /tmp/upx-extract -name upx.exe -type f | head -1)
          test -n "$UPX_BIN"
          echo "Using $UPX_BIN"
          before=$(python -c "import os; print(os.path.getsize('$PORTABLE'))")
          # 推荐 --best --lzma；失败则从 uncompressed 还原后改用 --best
          if "$UPX_BIN" --best --lzma --force "$PORTABLE"; then
            echo "UPX: --best --lzma OK"
          else
            echo "UPX: LZMA failed, fallback --best"
            cp "${base}-uncompressed.exe" "$PORTABLE"
            "$UPX_BIN" --best --force "$PORTABLE"
          fi
          after=$(python -c "import os; print(os.path.getsize('$PORTABLE'))")
          pct=$(( after * 100 / before ))
          echo "UPX size: ${before} -> ${after} bytes (${pct}% of original)"
          echo "==== out/ after UPX ===="
          ls -la out/
          test -f "$PORTABLE"
          test -f "${base}-uncompressed.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: out/*
          if-no-files-found: error
